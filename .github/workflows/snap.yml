name: tmp-snap

on:
  push:
    branches:
      - 'ci/**'

jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm i -g @antfu/ni
      - run: nci
      - run: nr build
      - run: npx vitest run -u test/factory-snap.test.ts test/api.test.ts
      - run: git status --short && git diff --stat && git diff -- test/__snapshots__/api
      - uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: test/__snapshots__
