name: CI

on:
  push:
    branches:
      - main
      - 'ci/**'

  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Setup
        run: npm i -g @antfu/ni

      - name: Install
        run: nci

      - name: Build
        run: nr build

      - name: Lint
        run: nr lint
        continue-on-error: true

      - name: Typecheck
        run: nr typecheck

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node: [lts/*]
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Setup
        run: npm i -g @antfu/ni

      - name: Install
        run: nci

      - name: Build
        run: nr build

      - name: Test
        run: nr test

      - name: '#671 check with svelte-eslint-parser 1.1.0 (expected to fail)'
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: pnpm add -D svelte-eslint-parser@1.1.0 && npx vitest run --reporter verbose tmp-671

      - name: '#671 check with svelte-eslint-parser 1.1.1'
        if: matrix.os == 'ubuntu-latest'
        run: pnpm add -D svelte-eslint-parser@1.1.1 && npx vitest run --reporter verbose tmp-671
